<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>釜山 4天3夜 自由行隨身手冊 (10/8 - 10/11)</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-light: #e0f2fe;
      --accent: #f97316;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 60px; }
    header { background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; padding: 24px 20px; text-align: center; }
    header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
    header p { font-size: 0.9rem; opacity: 0.95; }
    
    .nav-tabs { display: flex; background: white; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; overflow-x: auto; }
    .tab-btn { flex: 1; min-width: 80px; padding: 12px 6px; border: none; background: none; font-size: 0.9rem; font-weight: 600; color: var(--text-sub); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; text-align: center; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: var(--primary-light); }
    
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .card { background: var(--card-bg); border-radius: 14px; padding: 18px; margin-bottom: 14px; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: var(--accent); color: white; font-size: 0.75rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
    
    .day-selector { display: flex; gap: 8px; margin-bottom: 14px; }
    .day-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-sub); }
    .day-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .timeline-item { padding: 10px 0; border-bottom: 1px dashed var(--border); }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-time { font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
    .timeline-text { font-size: 0.95rem; line-height: 1.4; }
    .timeline-tip { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }
    
    .check-list { list-style: none; }
    .check-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    .check-item:last-child { border-bottom: none; }
    .check-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); margin-top: 2px; }
    
    .budget-grid { display: grid; gap: 12px; }
    .budget-row { display: flex; justify-content: space-between; align-items: center; }
    .budget-input { width: 110px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; text-align: right; font-size: 0.9rem; font-weight: 600; }
    .progress-bar-bg { width: 100%; height: 12px; background: #e2e8f0; border-radius: 6px; overflow: hidden; margin-top: 10px; }
    .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
    .stat-box { display: flex; justify-content: space-around; background: var(--primary-light); padding: 14px; border-radius: 10px; text-align: center; margin-top: 14px; }
    .stat-val { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
    .stat-lbl { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }
  </style>
</head>
<body>

  <header>
    <h1>釜山 4天3夜 自由行指南</h1>
    <p>2026/10/08 ~ 10/11 ｜ 總預算 NT$ 60,000</p>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('itinerary')">每日行程</button>
    <button class="tab-btn" onclick="switchTab('food')">必吃伴手禮</button>
    <button class="tab-btn" onclick="switchTab('budget')">預算記帳</button>
    <button class="tab-btn" onclick="switchTab('packing')">行前準備</button>
  </nav>

  <main class="container">
    <!-- 1. 行程 TAB -->
    <section id="itinerary" class="tab-content active">
      <div class="day-selector">
        <button class="day-btn active" onclick="switchDay(1)">Day 1 (10/8)</button>
        <button class="day-btn" onclick="switchDay(2)">Day 2 (10/9)</button>
        <button class="day-btn" onclick="switchDay(3)">Day 3 (10/10)</button>
        <button class="day-btn" onclick="switchDay(4)">Day 4 (10/11)</button>
      </div>

      <!-- Day 1 -->
      <div id="day-1" class="day-content">
        <div class="card">
          <div class="card-title">Day 1：抵達與南浦洞風情 <span class="badge">南浦 / 影島</span></div>
          <div class="timeline-item">
            <div class="timeline-time">中午 - 下午</div>
            <div class="timeline-text">抵達金海機場 ➔ 搭乘地鐵/計程車至飯店 Check-in</div>
          </div>
          <div class="timeline-item">
            <div class="timeline-time">下午</div>
            <div class="timeline-text">札嘎其海鮮市場、BIFF 廣場吃黑糖堅果餅</div>
            <div class="timeline-tip">💡 推薦體驗現撈海鮮與南浦洞道地街頭小吃</div>
          </div>
          <div class="timeline-item">
            <div class="timeline-time">傍晚 - 晚上</div>
            <div class="timeline-text">白淺灘文化村賞海景夕陽 ➔ 樂天超市採買零食</div>
          </div>
        </div>
      </div>

      <!-- Day 2 -->
      <div id="day-2" class="day-content" style="display:none;">
        <div class="card">
          <div class="card-title">Day 2：經典海景與天空膠囊 <span class="badge">海雲台</span></div>
          <div class="timeline-item">
            <div class="timeline-time">上午 09:30</div>
            <div class="timeline-text">尾浦站搭乘「天空膠囊列車」至青沙浦</div>
            <div class="timeline-tip">💡 記得提前 2 週於官網線上預約靠海側車廂</div>
          </div>
          <div class="timeline-item">
            <div class="timeline-time">中午 - 下午</div>
            <div class="timeline-text">青沙浦紅白燈塔、灌籃高手平交道、海景咖啡廳</div>
          </div>
          <div class="timeline-item">
            <div class="timeline-time">傍晚 - 晚上</div>
            <div class="timeline-text">海雲台沙灘漫步 ➔ The Bay 101 拍攝水中倒影摩天樓夜景</div>
          </div>
        </div>
      </div>

      <!-- Day 3 -->
      <div id="day-3" class="day-content" style="display:none;">
        <div class="card">
          <div class="card-title">Day 3：彩繪山城與潮流購物 <span class="badge">西面 / 松島</span></div>
          <div class="timeline-item">
            <div class="timeline-time">上午</div>
            <div class="timeline-text">甘川洞文化村（找小王子拍照、買手繪紀念品）</div>
          </div>
          <div class="timeline-item">
            <div class="timeline-time">下午</div>
            <div class="timeline-text">松島海上透明纜車 ➔ 龍宮雲橋俯瞰海景</div>
          </div>
          <div class="timeline-item">
            <div class="timeline-time">晚上</div>
            <div class="timeline-text">西面地下街與商圈大採購 ➔ 享用道地韓式烤五花肉與燒酒</div>
          </div>
        </div>
      </div>

      <!-- Day 4 -->
      <div id="day-4" class="day-content" style="display:none;">
        <div class="card">
          <div class="card-title">Day 4：廣安里巡禮與滿載而歸 <span class="badge">廣安里</span></div>
          <div class="timeline-item">
            <div class="timeline-time">上午</div>
            <div class="timeline-text">廣安里海水浴場（欣賞廣安大橋海天一色美景）</div>
          </div>
          <div class="timeline-item">
            <div class="timeline-time">中午</div>
            <div class="timeline-text">最後享用一碗熱騰騰的「豬肉湯飯」</div>
          </div>
          <div class="timeline-item">
            <div class="timeline-time">下午</div>
            <div class="timeline-text">前往金海機場辦理退稅、免稅店補貨、搭機返台</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. 美食與伴手禮 TAB -->
    <section id="food" class="tab-content">
      <div class="card">
        <div class="card-title">必吃美食清單</div>
        <ul class="check-list">
          <li class="check-item"><input type="checkbox" /> <div><strong>密陽血腸/松亭三代 豬肉湯飯</strong><br><small style="color:var(--text-sub)">釜山靈魂美食，搭配蝦醬與韭菜</small></div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>BIFF 廣場 黑糖堅果餅</strong><br><small style="color:var(--text-sub)">現炸香脆外皮包滿黑糖與多種堅果</small></div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>青沙浦現烤扇貝 / 札嘎其海鮮</strong><br><small style="color:var(--text-sub)">海邊現烤海鮮與肥美盲鰻</small></div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>海雲台 伍班長烤肉</strong><br><small style="color:var(--text-sub)">邊烤肉邊烤香濃蒸蛋圈</small></div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>韓式生醃醬蟹套餐</strong><br><small style="color:var(--text-sub)">白飯小偷，蟹膏拌飯極致鮮美</small></div></li>
        </ul>
      </div>

      <div class="card">
        <div class="card-title">必買伴手禮清單</div>
        <ul class="check-list">
          <li class="check-item"><input type="checkbox" /> <div><strong>古來思魚糕 (Goraesa)</strong><br><small style="color:var(--text-sub)">真空包裝魚糕（純海鮮無肉類申報可攜回）</small></div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>Busan Sand 釜山夾心餅</strong><br><small style="color:var(--text-sub)">香濃焦糖奶油內餡文青伴手禮</small></div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>Olive Young 美妝保養</strong><br><small style="color:var(--text-sub)">Torriden精華、Abib面膜、低卡貝果脆片</small></div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>樂天超市零食</strong><br><small style="color:var(--text-sub)">HBAF杏仁果、Market O布朗尼、海苔酥</small></div></li>
        </ul>
      </div>
    </section>

    <!-- 3. 預算記帳 TAB -->
    <section id="budget" class="tab-content">
      <div class="card">
        <div class="card-title">預算即時計算器 (NT$)</div>
        <div class="budget-grid">
          <div class="budget-row"><span>總預算上限</span><input id="in-total" class="budget-input" type="number" value="60000" oninput="calcBudget()" /></div>
          <div class="budget-row"><span>機票費用</span><input id="in-flight" class="budget-input" type="number" value="12000" oninput="calcBudget()" /></div>
          <div class="budget-row"><span>三晚住宿</span><input id="in-hotel" class="budget-input" type="number" value="14000" oninput="calcBudget()" /></div>
          <div class="budget-row"><span>餐飲與交通門票</span><input id="in-food" class="budget-input" type="number" value="15000" oninput="calcBudget()" /></div>
          <div class="budget-row"><span>伴手禮與購物</span><input id="in-shop" class="budget-input" type="number" value="19000" oninput="calcBudget()" /></div>
        </div>
        <div class="progress-bar-bg"><div id="budget-prog" class="progress-bar"></div></div>
        <div class="stat-box">
          <div><div id="out-spent" class="stat-val">NT$ 60,000</div><div class="stat-lbl">目前已規劃金額</div></div>
          <div><div id="out-remain" class="stat-val" style="color:var(--success)">NT$ 0</div><div class="stat-lbl">剩餘可支配預算</div></div>
        </div>
      </div>
    </section>

    <!-- 4. 行前準備 TAB -->
    <section id="packing" class="tab-content">
      <div class="card">
        <div class="card-title">行前必備檢查清單</div>
        <ul class="check-list">
          <li class="check-item"><input type="checkbox" checked /> <div><strong>護照正本</strong>（效期需在 6 個月以上）</div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>韓國網卡 / eSIM</strong>（開通漫遊或掃描 QR code）</div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>T-Money 交通卡</strong>（地鐵/公車/超商通用）</div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>轉接頭（韓國 2 圓孔 220V 規格）</strong></div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>下載 Kakao Map / Naver Map 與 Papago 翻譯 App</strong></div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>天空膠囊列車預約確認信</strong></div></li>
          <li class="check-item"><input type="checkbox" /> <div><strong>海外高回饋信用卡與部分韓幣現金</strong></div></li>
        </ul>
      </div>
    </section>
  </main>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function switchDay(dayNum) {
      document.querySelectorAll('.day-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.day-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('day-' + dayNum).style.display = 'block';
      event.target.classList.add('active');
    }

    function calcBudget() {
      const total = parseFloat(document.getElementById('in-total').value) || 0;
      const flight = parseFloat(document.getElementById('in-flight').value) || 0;
      const hotel = parseFloat(document.getElementById('in-hotel').value) || 0;
      const food = parseFloat(document.getElementById('in-food').value) || 0;
      const shop = parseFloat(document.getElementById('in-shop').value) || 0;
      
      const spent = flight + hotel + food + shop;
      const remain = total - spent;
      
      document.getElementById('out-spent').innerText = 'NT$ ' + spent.toLocaleString();
      const remainEl = document.getElementById('out-remain');
      remainEl.innerText = 'NT$ ' + remain.toLocaleString();
      remainEl.style.color = remain >= 0 ? 'var(--success)' : '#ef4444';
      
      const pct = total > 0 ? Math.min((spent / total) * 100, 100) : 0;
      document.getElementById('budget-prog').style.width = pct + '%';
    }
    calcBudget();
  </script>
</body>
</html>
